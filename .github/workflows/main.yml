name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Android and Force Fix minSdk
        run: |
          flutter create . --project-name eps_assistant_dz --platforms=android
          
          # استخدام Python لتعديل الإصدار بالقوة المطلقة
          python -c "
          import os
          if os.path.exists('android/app/build.gradle.kts'):
              with open('android/app/build.gradle.kts', 'r') as f: content = f.read()
              content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              with open('android/app/build.gradle.kts', 'w') as f: f.write(content)
          if os.path.exists('android/app/build.gradle'):
              with open('android/app/build.gradle', 'r') as f: content = f.read()
              content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              with open('android/app/build.gradle', 'w') as f: f.write(content)
          "
          
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
