name: eps_assistant_dz
description: "EPS Assistant DZ — مساعد أستاذ التربية البدنية والرياضية في الجزائر."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.6.1

  # --- Local database ---
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # --- Settings / PIN / trial period ---
  shared_preferences: ^2.3.3
  crypto: ^3.0.6

  # --- PDF reports ---
  pdf: ^3.11.1
  printing: ^5.13.4

  # --- Backup & restore ---
  file_picker: ^8.1.6
  share_plus: ^10.1.2

  # --- Utilities ---
  equatable: ^2.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ضع هذين الملفين (النسخة static من Google Fonts) في المجلد assets/fonts/ :
  #   Cairo-Regular.ttf   و   Cairo-Bold.ttf
  # (لا تستعمل الخط المتغيّر Cairo[slnt,wght].ttf مع حزمة pdf)
  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
